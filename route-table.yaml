# Bound on Spec 009 2026-09-11 by operator sentence.
# Packet yggdrasil.route.v0. Home RUNTIME_GATE.
# R011 rows added 2026-09-11: construct classify only.
# No train. No Hub. No Sigil-Forge import.

version: 0
lane: SHADOW
specialist: yggdrasil.topology
packet: yggdrasil.route.v0
tier1: RUNTIME_GATE
yggdrasil_home: yggdrasil.runtime_gate
name_gate: false
forecast_eligible: false
can_promote: false

rules:
  - id: R009
    packet: route_atom
    specialists: [yggdrasil.topology]
    allow: [route_class, scan_class, integrity, unknown_node]
    deny: [promotion, forecast, learned_residual]
  - id: R010
    packet: unknown_namespace
    specialists: [yggdrasil.topology]
    result: NOT_COMPUTABLE
    scan_class: unknown_node
    failure: UNKNOWN_NODE_GATE
  - id: R011
    packet: construct_atom
    specialists: [sigil.forge.construct]
    home: yggdrasil.viz
    packet_schema: sigil.forge.v0
  - id: R011B
    packet: mixed_tradition_construct
    specialists: [athanor.structure, sigil.forge.construct]
    order: [athanor.structure, sigil.forge.construct]
  - id: R011C
    packet: mixed_sign_construct
    specialists: [semion.triad, sigil.forge.construct]
    order: [semion.triad, sigil.forge.construct]
  - id: R011D
    packet: noctis_sig
    specialists: [noctis.interpret, sigil.forge.construct]
    order: [noctis.interpret, sigil.forge.construct]
  - id: R004
    packet: forecast_request
    specialists: []
    result: NOT_COMPUTABLE
    note: unchanged from Spec 009
